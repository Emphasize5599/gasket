name: Build signed APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-apk.yml
      - AndroidManifest.xml
      - build.sh
      - src/**
      - res/**
      - assets/**
      - tests/tirerack.test.js
      - tests/tires.test.js

permissions:
  contents: read

concurrency:
  group: signed-apk-main
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Test Tire Rack request lifecycle and failure UI
        run: |
          npm install --prefix "$RUNNER_TEMP/gasket-tests" playwright@1.63.0
          "$RUNNER_TEMP/gasket-tests/node_modules/.bin/playwright" install --with-deps chromium
          export NODE_PATH="$RUNNER_TEMP/gasket-tests/node_modules"
          node tests/tires.test.js
          node tests/tirerack.test.js

      - name: Check release signing configuration
        id: signing
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          GASKET_KEYSTORE_B64: ${{ secrets.GASKET_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_PASS" ] && [ -n "$GASKET_KEYSTORE_B64" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::APK signing is not configured. Add repository Actions secrets KS_PASS and GASKET_KEYSTORE_B64 using the existing release key, then run this workflow on main. No replacement key will be generated."
          fi

      - name: Install Android SDK tools and Java
        if: steps.signing.outputs.ready == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk android-sdk-build-tools android-sdk-platform-23 openjdk-17-jdk-headless

      - name: Read app version
        if: steps.signing.outputs.ready == 'true'
        id: version
        run: |
          version=$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' AndroidManifest.xml | head -1)
          test -n "$version"
          echo "name=$version" >> "$GITHUB_OUTPUT"

      - name: Build with the existing release key and verify APK
        if: steps.signing.outputs.ready == 'true'
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          GASKET_KEYSTORE_B64: ${{ secrets.GASKET_KEYSTORE_B64 }}
        run: |
          bash build.sh
          test -s Gasket.apk
          apksigner verify --verbose Gasket.apk

      - name: Upload signed APK for download
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Gasket-${{ steps.version.outputs.name }}-signed
          path: Gasket.apk
          if-no-files-found: error
          retention-days: 7
