name: Build signed APK

on:
  workflow_dispatch:
  push:
    branches: [main, test/keyless-regular-gas]
    paths:
      - .github/workflows/build-apk.yml
      - AndroidManifest.xml
      - build.sh
      - src/**
      - res/**
      - assets/**
      - tests/tirerack.test.js
      - tests/tires.test.js
      - tests/keylessgas.test.js
      - tests/keyless-parallel.test.js
      - tests/pricehistory.test.js
      - tests/map-refresh.test.js
      - tests/fuel-grades.test.js
      - tests/picture-storage.test.js
      - tests/saved-prices.test.js
      - tests/routes-budget.test.js
      - tests/routes-limit.test.js

permissions:
  contents: write

concurrency:
  group: signed-apk-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test/keyless-regular-gas'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Test Tire Rack request lifecycle and failure UI
        run: |
          npm install --prefix "$RUNNER_TEMP/gasket-tests" playwright@1.63.0
          "$RUNNER_TEMP/gasket-tests/node_modules/.bin/playwright" install --with-deps chromium
          export NODE_PATH="$RUNNER_TEMP/gasket-tests/node_modules"
          node tests/tires.test.js
          node tests/tirerack.test.js
          node tests/picture-storage.test.js
          if [ -f tests/keylessgas.test.js ]; then node tests/keylessgas.test.js; fi
          if [ -f tests/keyless-parallel.test.js ]; then node tests/keyless-parallel.test.js; fi
          if [ -f tests/pricehistory.test.js ]; then node tests/pricehistory.test.js; fi
          if [ -f tests/map-refresh.test.js ]; then node tests/map-refresh.test.js; fi
          if [ -f tests/fuel-grades.test.js ]; then node tests/fuel-grades.test.js; fi
          if [ -f tests/saved-prices.test.js ]; then node tests/saved-prices.test.js; fi
          if [ -f tests/routes-limit.test.js ]; then node tests/routes-limit.test.js; fi

      - name: Check release signing configuration
        id: signing
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          GASKET_KEYSTORE_B64: ${{ secrets.GASKET_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_PASS" ] && [ -n "$GASKET_KEYSTORE_B64" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::APK signing is not configured. Add repository Actions secrets KS_PASS and GASKET_KEYSTORE_B64 using the existing release key, then run this workflow on main. No replacement key will be generated."
          fi

      - name: Install Android SDK tools and Java
        if: steps.signing.outputs.ready == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk android-sdk-build-tools android-sdk-platform-23 openjdk-17-jdk-headless
          curl --fail --location --retry 2 https://dl.google.com/android/repository/platform-31_r01.zip -o "$RUNNER_TEMP/platform-31.zip"
          echo "ca5bcaa565cb37e9d287051d6dd0e49a5426ec29  $RUNNER_TEMP/platform-31.zip" | sha1sum -c -
          unzip -q "$RUNNER_TEMP/platform-31.zip" -d "$RUNNER_TEMP/gasket-platform"
          echo "ANDROID_JAR=$(find "$RUNNER_TEMP/gasket-platform" -name android.jar -print -quit)" >> "$GITHUB_ENV"

      - name: Read app version
        if: steps.signing.outputs.ready == 'true'
        id: version
        run: |
          version=$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' AndroidManifest.xml | head -1)
          test -n "$version"
          echo "name=$version" >> "$GITHUB_OUTPUT"

      - name: Test actual native Routes reservation gate
        if: steps.signing.outputs.ready == 'true'
        run: GASKET_NATIVE_TESTS=1 node tests/routes-budget.test.js

      - name: Build with the existing release key and verify APK
        if: steps.signing.outputs.ready == 'true'
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          GASKET_KEYSTORE_B64: ${{ secrets.GASKET_KEYSTORE_B64 }}
        run: |
          bash build.sh
          test -s Gasket.apk
          apksigner verify --verbose Gasket.apk
          cp Gasket.apk "Gasket-${{ steps.version.outputs.name }}.apk"

      # Actions downloads are always ZIPs. Release assets keep the original APK extension.
      - name: Publish direct APK download on the version's release
        if: steps.signing.outputs.ready == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.name }}"
          for attempt in $(seq 1 12); do
            if gh release view "$tag" >/dev/null 2>&1; then break; fi
            sleep 5
          done
          gh release view "$tag" >/dev/null
          release_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
          test "$release_sha" = "$GITHUB_SHA"
          asset="Gasket-${{ steps.version.outputs.name }}.apk"
          # Do not overwrite a previously shipped APK on a workflow rerun.
          if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fx "$asset" >/dev/null; then
            echo "APK already published; leaving it unchanged."
          else
            gh release upload "$tag" "$asset"
          fi

      - name: Publish separate experimental APK download
        if: steps.signing.outputs.ready == 'true' && github.ref == 'refs/heads/test/keyless-regular-gas'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="keyless-test-v${{ steps.version.outputs.name }}"
          asset="Gasket-${{ steps.version.outputs.name }}-keyless-test.apk"
          cp Gasket.apk "$asset"
          if gh release view "$tag" >/dev/null 2>&1; then
            release_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
            test "$release_sha" = "$GITHUB_SHA"
          else
            ver="${{ steps.version.outputs.name }}"
            awk -v v="$ver" 'index($0, "## " v " ") == 1 || $0 == "## " v { p = 1; next } p && /^## / { exit } p' CHANGELOG.md > notes.md
            test -s notes.md
            gh release create "$tag" --target "$GITHUB_SHA" --title "Gasket keyless test $ver" --notes-file notes.md --prerelease
          fi
          if ! gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fx "$asset" >/dev/null; then
            gh release upload "$tag" "$asset"
          fi

      - name: Upload signed APK for download
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Gasket-${{ steps.version.outputs.name }}-signed
          path: Gasket-${{ steps.version.outputs.name }}.apk
          if-no-files-found: error
          retention-days: 7
