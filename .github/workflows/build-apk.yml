      - tests/fresh-car-lookups.test.js
      - tests/ai-defaults.test.js
      - tests/debug-log.test.js
      - tests/erase-logging.test.js
      - tests/brave-reader.test.js
      - tests/brave-verification.test.js
      - tests/gemma-cache.test.js
      - tests/reader-resources.test.js
      - tests/ev-discovery.test.js
      - tests/ev-discovery-ui.test.js
      - tools/reader-resource-policy.js
      - tests/wet-tire-route.test.js
      - tests/hazard-warning-matrix.test.js
      - tests/vehicle-weather.test.js
      - tests/vehicle-weather-ui.test.js
      - tests/vehicle-required.test.js
      - tests/adaptive-readers.test.js
      - tests/tire-estimate-ui.test.js
      - tests/planner-worker.test.js
      - tests/map-refresh.test.js
      - tests/fuel-grades.test.js
      - tests/keyless-discovery.test.js
      - tests/keyless-discovery-ui.test.js
      - tests/climate.test.js
      - tests/walmart-keyless.test.js
      - tests/run-node.js
      - tests/picture-storage.test.js
      - tests/saved-prices.test.js
      - tests/routes-budget.test.js
      - tests/routes-limit.test.js
      - tests/worker-pool.test.js
      - tests/citgo-trip.test.js
      - tests/citgo-trip-ui.test.js
      - tests/scan-audit.test.js
      - tests/vin-feedback.test.js
      - tests/roadside-cash.test.js
      - tests/speed-settings.test.js
      - tests/speed.test.js
      - tests/trip.test.js
      - tests/limits.test.js
      - tests/discovery-log.test.js
      - tests/routewx.test.js
      - tests/speed-nokey.test.js
      - tests/tile-hazards.test.js
      - tests/vin-trim.test.js
      - tests/recall-check.test.js
      - tests/nhtsa-reader.test.js
      - tests/editor-tires.test.js
      - tests/hazard-prefetch.test.js
      - tests/styled-tire-flow.test.js
      - tests/trailer-editor.test.js
      - tests/vehicle-catalog.test.js
      - tests/nhtsa-catalog.test.js
      - tests/setup-demo.test.js
      - tests/background-search.test.js
      - tests/tasks.test.js
      - tests/severity.test.js
      - tests/gemma.test.js
      - tests/gemma-ui.test.js
      - tests/gemma-native.test.js
      - tests/apk-build.test.js

permissions:
  contents: write

concurrency:
  group: signed-apk-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test/keyless-regular-gas'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache pinned browser test runtime
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/gasket-tests
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-gasket-playwright-1.63.0-headless-v1

      - name: Prepare browser test runtime
        run: |
          if [ '${{ steps.browser-cache.outputs.cache-hit }}' != 'true' ]; then
            npm install --prefix "$RUNNER_TEMP/gasket-tests" playwright@1.63.0
            "$RUNNER_TEMP/gasket-tests/node_modules/.bin/playwright" install chromium --only-shell
          fi
          export NODE_PATH="$RUNNER_TEMP/gasket-tests/node_modules"
          # Hosted runners normally have the shared libraries. Install them only if a launch actually fails.
          if ! node -e 'require("playwright").chromium.launch().then(b=>b.close()).catch(e=>{console.error(e.message);process.exit(1)})'; then
            "$RUNNER_TEMP/gasket-tests/node_modules/.bin/playwright" install --with-deps chromium --only-shell
          fi

      - name: Run release regressions in parallel
        run: NODE_PATH="$RUNNER_TEMP/gasket-tests/node_modules" TEST_JOBS=3 node tests/run-node.js --release

      - name: Check release signing configuration
        id: signing
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          GASKET_KEYSTORE_B64: ${{ secrets.GASKET_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_PASS" ] && [ -n "$GASKET_KEYSTORE_B64" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::APK signing is not configured. Add repository Actions secrets KS_PASS and GASKET_KEYSTORE_B64 using the existing release key, then run this workflow on main. No replacement key will be generated."
          fi

      - uses: actions/setup-java@v5
        if: steps.signing.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache pinned Gradle and native dependencies
        if: steps.signing.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/gasket-gradle
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gasket-gradle-8.13-${{ hashFiles('build.gradle', 'settings.gradle', 'gradle.properties') }}
          restore-keys: ${{ runner.os }}-gasket-gradle-8.13-

      - name: Cache Android SDK for minimal runner images
        if: steps.signing.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/gasket-android-sdk
          key: gasket-sdk-command19-platform35-tools35-v1

      - name: Prepare Android compile platform
        if: steps.signing.outputs.ready == 'true'
        timeout-minutes: 10
        run: |
          # Recent ubuntu-22.04 images no longer provide sdkmanager on PATH.
          GASKET_SDK="${ANDROID_HOME:-$HOME/.cache/gasket-android-sdk}"
          SDKMANAGER="$GASKET_SDK/cmdline-tools/19.0/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            curl --fail --location --retry 2 https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o "$RUNNER_TEMP/gasket-sdk-tools.zip"
            # Checksum published in Google's repository2-1.xml for cmdline-tools;19.0.
            echo "5fdcc763663eefb86a5b8879697aa6088b041e70  $RUNNER_TEMP/gasket-sdk-tools.zip" | sha1sum -c -
            unzip -q "$RUNNER_TEMP/gasket-sdk-tools.zip" -d "$RUNNER_TEMP/gasket-sdk-tools"
            mkdir -p "$GASKET_SDK/cmdline-tools"
            mv "$RUNNER_TEMP/gasket-sdk-tools/cmdline-tools" "$GASKET_SDK/cmdline-tools/19.0"
          fi
          (yes || true) | "$SDKMANAGER" --sdk_root="$GASKET_SDK" --licenses >/dev/null
          "$SDKMANAGER" --sdk_root="$GASKET_SDK" 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$GASKET_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$GASKET_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_JAR=$GASKET_SDK/platforms/android-35/android.jar" >> "$GITHUB_ENV"
          echo "$GASKET_SDK/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Read app version
        if: steps.signing.outputs.ready == 'true'
        id: version
        run: |
          version=$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' AndroidManifest.xml | head -1)
          test -n "$version"
          echo "name=$version" >> "$GITHUB_OUTPUT"

      - name: Test actual native Routes reservation gate
        if: steps.signing.outputs.ready == 'true'
        run: |
          GASKET_NATIVE_TESTS=1 node tests/routes-budget.test.js
          GASKET_NATIVE_TESTS=1 node tests/gemma-native.test.js
          GASKET_NATIVE_TESTS=1 node tests/backup-io.test.js
          GASKET_NATIVE_TESTS=1 node tests/reader-resources.test.js

      - name: Build with the existing release key and verify APK
        if: steps.signing.outputs.ready == 'true'
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          GASKET_KEYSTORE_B64: ${{ secrets.GASKET_KEYSTORE_B64 }}
        run: |
          bash build.sh
          GASKET_APK_VERIFY=1 node tests/apk-build.test.js
          for abi in arm64-v8a universal; do
            cp "Gasket-$abi.apk" "Gasket-${{ steps.version.outputs.name }}-$abi.apk"
          done

      # Actions downloads are always ZIPs. Release assets keep the original APK extension.
      - name: Publish direct APK download on the version's release
        if: steps.signing.outputs.ready == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.name }}"
          for attempt in $(seq 1 12); do
            if gh release view "$tag" >/dev/null 2>&1; then break; fi
            sleep 5
          done
          gh release view "$tag" >/dev/null
          release_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
          test "$release_sha" = "$GITHUB_SHA"
          # Do not overwrite a previously shipped APK on a workflow rerun.
          for abi in arm64-v8a universal; do
            asset="Gasket-${{ steps.version.outputs.name }}-$abi.apk"
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fx "$asset" >/dev/null; then
              echo "APK already published; leaving it unchanged."
            else
              gh release upload "$tag" "$asset"
            fi
          done

      - name: Publish separate experimental APK download
        if: steps.signing.outputs.ready == 'true' && github.ref == 'refs/heads/test/keyless-regular-gas'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="keyless-test-v${{ steps.version.outputs.name }}"
          for abi in arm64-v8a universal; do
            cp "Gasket-$abi.apk" "Gasket-${{ steps.version.outputs.name }}-keyless-test-$abi.apk"
          done
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = 'true' ]; then
              # GitHub may not create a draft release's tag until publication.
              release_sha=$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)
            else
              release_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
            fi
            test "$release_sha" = "$GITHUB_SHA"
          else
            ver="${{ steps.version.outputs.name }}"
            awk -v v="$ver" 'index($0, "## " v " ") == 1 || $0 == "## " v { p = 1; next } p && /^## / { exit } p' CHANGELOG.md > notes.md
            test -s notes.md
            gh release create "$tag" --target "$GITHUB_SHA" --title "Gasket keyless test $ver" --notes-file notes.md --prerelease --draft
          fi
          for abi in arm64-v8a universal; do
            asset="Gasket-${{ steps.version.outputs.name }}-keyless-test-$abi.apk"
            if ! gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fx "$asset" >/dev/null; then
              gh release upload "$tag" "$asset"
            fi
          done
          # Obtainium must not see a half-uploaded architecture set.
          gh release edit "$tag" --draft=false

      - name: Upload signed APK for download
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Gasket-${{ steps.version.outputs.name }}-signed
          path: |
            Gasket-${{ steps.version.outputs.name }}-arm64-v8a.apk
            Gasket-${{ steps.version.outputs.name }}-universal.apk
          if-no-files-found: error
          retention-days: 7
