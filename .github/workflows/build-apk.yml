name: Build signed APK

on:
  workflow_dispatch:
  push:
    branches: [main, test/keyless-regular-gas]
    paths:
      - .github/workflows/build-apk.yml
      - AndroidManifest.xml
      - build.sh
      - build.gradle
      - settings.gradle
      - gradle.properties
      - src/**
      - res/**
      - assets/**
      - tests/tirerack.test.js
      - tests/tires.test.js
      - tests/keylessgas.test.js
      - tests/keyless-parallel.test.js
      - tests/slow-link.test.js
      - tests/map-tiers.test.js
      - tests/map-tiers-ui.test.js
      - tests/tolls.test.js
      - tests/tolls-ui.test.js
      - tests/backup-io.test.js
      - tests/saved-partial-search.test.js
      - tests/vinscan.test.js
      - tests/vinscan-ui.test.js
      - tests/tank-answer-ui.test.js
