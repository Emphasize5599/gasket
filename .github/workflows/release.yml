# A new version pushed to main is released automatically: when android:versionName in AndroidManifest.xml has no
# GitHub Release yet, this tags the pushed commit v<versionName> and creates the release. The notes come from
# CHANGELOG.md, and the only downloads are the source code archives GitHub attaches to every release.
# No APK is built or uploaded.
name: Release

on:
  push:
    branches: [main]
    paths: [AndroidManifest.xml, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: v
        run: |
          ver=$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' AndroidManifest.xml | head -1)
          if [ -z "$ver" ]; then echo "::error::No android:versionName in AndroidManifest.xml"; exit 1; fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already released
        id: seen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "v${{ steps.v.outputs.version }} is already released."
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release notes from CHANGELOG.md
        if: steps.seen.outputs.done != 'true'
        run: |
          ver="${{ steps.v.outputs.version }}"
          awk -v v="$ver" 'index($0, "## " v " ") == 1 || $0 == "## " v { p = 1; next } p && /^## / { exit } p' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no entry for $ver"
            exit 1
          fi

      - name: Tag and release (source code only, marked pre-release while in alpha)
        if: steps.seen.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${{ steps.v.outputs.version }}"
          gh release create "v$ver" --target "$GITHUB_SHA" --title "Gasket $ver" --notes-file notes.md --prerelease
