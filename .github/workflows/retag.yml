# One-off: point the release tags v0.0.64–v0.0.68 at the rewritten commits (history scrub). Deleted after it runs.
name: Retag

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move the tags
        run: |
          set -e
          for p in v0.0.64:63afc259ebffe3335e7f0d074ead54b4002fad1b v0.0.65:aa16ad7ac8bf7195d76a76c3ba3f47f29909d499 \
                   v0.0.66:cbf1e2b19e676599f274b090acb95ab4dc9af080 v0.0.67:e961c3eff71c6d3423d2930bab32f2e442c82ed0 \
                   v0.0.68:a137e2757ae358b9849fb175b80acbefc41700de; do
            t=${p%%:*}; c=${p#*:}
            git cat-file -e "$c^{commit}"
            git merge-base --is-ancestor "$c" origin/main
            git push --force origin "$c:refs/tags/$t"
          done
          git ls-remote --tags origin
