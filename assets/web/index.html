<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Fuel+ Map</title>
<link rel="stylesheet" href="lib/leaflet.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="map"></div>

<header class="top">
  <div class="bar">
    <div class="seg" id="grades" role="tablist"></div>
    <button class="icon" id="btnRefresh" aria-label="Refresh prices">
      <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>
    <button class="icon" id="btnSettings" aria-label="Settings">
      <svg viewBox="0 0 24 24"><path d="M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7 7 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.49.42l-.36 2.54c-.59.24-1.13.56-1.63.94l-2.39-.96a.5.5 0 0 0-.61.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.3.61.22l2.39-.96c.5.38 1.04.7 1.63.94l.36 2.54c.05.24.25.42.49.42h3.84c.25 0 .45-.18.49-.42l.36-2.54c.59-.24 1.13-.56 1.63-.94l2.39.96c.22.08.48 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/></svg>
    </button>
  </div>
  <div class="status" id="status">Finding you…</div>
</header>

<button class="chip-btn hidden" id="btnArea">Search this area</button>

<div class="banner hidden" id="wmCheck">
  <div><b id="wmCheckTitle">Walmart wants a quick check</b><br><span>Complete the site's “are you human?” step once to load its prices.</span></div>
  <button id="wmCheckGo">Open</button><button id="wmCheckX" aria-label="Dismiss">✕</button>
</div>

<button class="fab-x" id="btnTrip" aria-label="Plan fuel stops for a trip">
  <svg viewBox="0 0 24 24"><path d="M6 3a3 3 0 0 0-1 5.83V15a5 5 0 0 0 5 5h4.17A3 3 0 1 0 14.17 18H10a3 3 0 0 1-3-3V8.83A3 3 0 0 0 6 3zm0 2a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm11 12a1 1 0 1 1 0 2 1 1 0 0 1 0-2zM15 3h4a2 2 0 0 1 2 2v4l-2-1.5L17 9V5h-2z"/></svg>
  <span>Trip</span>
</button>

<button class="fab" id="btnLocate" aria-label="My location">
  <svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8.94 3A8.99 8.99 0 0 0 13 3.06V1h-2v2.06A8.99 8.99 0 0 0 3.06 11H1v2h2.06A8.99 8.99 0 0 0 11 20.94V23h2v-2.06A8.99 8.99 0 0 0 20.94 13H23v-2h-2.06zM12 19a7 7 0 1 1 0-14 7 7 0 0 1 0 14z"/></svg>
</button>

<!-- Ranked list (collapsed shows the best deal) -->
<section class="sheet list" id="listSheet">
  <div class="grab" id="listGrab"><span></span></div>
  <div class="list-head">
    <div id="bestLine" class="best-line">—</div>
    <div class="sort" id="sort">
      <button data-sort="price" class="on">Price</button><button data-sort="dist">Distance</button>
    </div>
  </div>
  <div class="rows" id="rows"></div>
</section>

<!-- Station detail -->
<section class="sheet detail hidden" id="detail" aria-modal="true"></section>

<!-- Trip planner -->
<section class="page hidden" id="trip"></section>
<section class="sheet tsheet hidden" id="tripSheet"></section>

<!-- Settings / onboarding -->
<section class="page hidden" id="settings"></section>

<div class="scrim hidden" id="scrim"></div>
<div class="toast hidden" id="toast"></div>

<script src="lib/leaflet.js"></script>
<script src="log.js"></script>
<script src="pricing.js"></script>
<script src="demo.js"></script>
<script src="trip.js"></script>
<script src="app.js"></script>
<script src="tripui.js"></script>
</body>
</html>
